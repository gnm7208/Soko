version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soko
      POSTGRES_PASSWORD: soko_password
      POSTGRES_DB: soko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soko -d soko"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
