services:
  - type: web
    name: soko-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. alembic -c server/migrations/alembic.ini upgrade head && PYTHONPATH=. gunicorn server.wsgi:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soko-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_SAMESITE
        value: "None"
      # Set to the deployed frontend origin after the Vercel deploy exists —
      # comma-separated, no trailing slash (e.g. https://soko-app.vercel.app).
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: STORAGE_PATH
        value: "./uploads"

databases:
  - name: soko-db
    plan: free
    databaseName: soko
    user: soko
